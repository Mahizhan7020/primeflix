{% extends "base.html" %}{% block title %}Sign In — PrimeFlix{% endblock %}{% block content %}

<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email</label><input type="email" name="email" autocomplete="email" required><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button class="btn primary full">Sign in</button></form>
<p class="switch">New to PrimeFlix? <a href="{{ url_for('signup') }}">Create your account</a></p></div></div>{% endblock %}
