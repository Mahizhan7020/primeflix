{% extends "base.html" %}{% block title %}Create Account — PrimeFlix{% endblock %}{% block content %}
<div class="auth-page"><div class="auth-card"><div class="brand big">prime<span>flix</span></div><h1>Create account</h1><p class="muted">Join PrimeFlix and build your personal watchlist.</p>
<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name</label><input name="name" maxlength="100" autocomplete="name" required><label>Email</label><input type="email" name="email" maxlength="150" autocomplete="email" required><label>Phone</label><input name="phone" maxlength="20" autocomplete="tel" required><label>Password</label><input type="password" name="password" minlength="8" autocomplete="new-password" required><label>Confirm password</label><input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required><button class="btn primary full">Create account</button></form>
<p class="switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
